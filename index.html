<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>沖国 駐車場状況</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: system-ui, sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:10px;
}
h1{text-align:center;}
.parking{
  background:#fff;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
}
.free{color:green;}
.busy{color:orange;font-weight:bold;}
.full{color:red;font-weight:bold;}
</style>
</head>

<body>
<h1>🚗 沖国 駐車場状況</h1>
<div id="parkingList"></div>

<script>
/* ===== 初期データ ===== */
const DEFAULT_PARKINGS = [
 {id:1,name:"第1駐車場",max:200,now:50},
 {id:2,name:"第2駐車場",max:180,now:30},
 {id:3,name:"第3駐車場",max:150,now:120},
 {id:4,name:"第4駐車場",max:100,now:20},
 {id:5,name:"第5駐車場",max:120,now:90},
 {id:6,name:"第6駐車場",max:80, now:70},
 {id:7,name:"第7駐車場",max:60, now:55}
];

/* ===== localStorage安全チェック ===== */
function loadParkings(){
 try{
   const data = JSON.parse(localStorage.getItem("parkings"));
   if(!Array.isArray(data)) throw "壊れてる";
   return data;
 }catch(e){
   localStorage.setItem("parkings", JSON.stringify(DEFAULT_PARKINGS));
   return DEFAULT_PARKINGS;
 }
}

/* ===== 表示 ===== */
function render(){
 const list = document.getElementById("parkingList");
 list.innerHTML = "";

 const parkings = loadParkings();

 parkings.forEach(p=>{
   const remain = Math.max(p.max - p.now, 0);
   let cls="free", text="空きあり";
   if(remain===0){cls="full";text="満車";}
   else if(remain<10){cls="busy";text="混雑";}

   const div = document.createElement("div");
   div.className="parking";
   div.innerHTML = `
     <h3>${p.name}</h3>
     <p class="${cls}">${text}（${remain}台）</p>
   `;
   list.appendChild(div);
 });
}

render();
</script>
</body>
</html>
