<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>沖国 駐車場状況</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: system-ui, sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:10px;
}
h1{text-align:center;}
.parking{
  background:#fff;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
}
.free{color:green;}
.busy{color:orange;font-weight:bold;}
.full{color:red;font-weight:bold;}
button{
  padding:6px 12px;
  margin-top:6px;
}
#authArea input{
  padding:6px;
  margin:4px;
}
</style>
</head>

<body>

<h1>🚗 沖国 駐車場状況</h1>
<div id="authArea" style="text-align:center;margin-bottom:15px;"></div>
<div id="parkingList"></div>

<script>
/* ===== 管理者ID・パス ===== */
const ADMIN_ID = "admin";
const ADMIN_PASS = "okigoku123";

/* ===== 初期データ ===== */
const DEFAULT_PARKINGS = [
 {id:1,name:"第1駐車場",lat:26.2625,lng:127.7564,max:200,now:50},
 {id:2,name:"第2駐車場",lat:26.2630,lng:127.7558,max:180,now:30},
 {id:3,name:"第3駐車場",lat:26.2635,lng:127.7549,max:150,now:120},
 {id:4,name:"第4駐車場",lat:26.2619,lng:127.7572,max:100,now:20},
 {id:5,name:"第5駐車場",lat:26.2615,lng:127.7580,max:120,now:90},
 {id:6,name:"第6駐車場",lat:26.2609,lng:127.7575,max:80, now:70},
 {id:7,name:"第7駐車場",lat:26.2605,lng:127.7569,max:60, now:55}
];

/* ===== localStorage ===== */
function loadParkings(){
 try{
   const data = JSON.parse(localStorage.getItem("parkings"));
   if(!Array.isArray(data)) throw "broken";
   return data;
 }catch(e){
   localStorage.setItem("parkings", JSON.stringify(DEFAULT_PARKINGS));
   return DEFAULT_PARKINGS;
 }
}

/* ===== 認証 ===== */
function isLoggedIn(){
  return localStorage.getItem("adminLogin") === "true";
}

function login(){
  const id = document.getElementById("loginId").value;
  const pass = document.getElementById("loginPass").value;

  if(id === ADMIN_ID && pass === ADMIN_PASS){
    localStorage.setItem("adminLogin","true");
    render();
  }else{
    alert("IDかパスワード違うよ");
  }
}

function logout(){
  localStorage.removeItem("adminLogin");
  render();
}

/* ===== 認証UI ===== */
function renderAuth(){
  const area = document.getElementById("authArea");

  if(isLoggedIn()){
    area.innerHTML = `
      <p>🛠 管理者ログイン中</p>
      <button onclick="logout()">サインアウト</button>
    `;
  }else{
    area.innerHTML = `
      <input id="loginId" placeholder="管理者ID">
      <input id="loginPass" type="password" placeholder="パスワード">
      <br>
      <button onclick="login()">サインイン</button>
    `;
  }
}

/* ===== 表示 ===== */
function render(){
  renderAuth();

  const list = document.getElementById("parkingList");
  list.innerHTML = "";

  const parkings = loadParkings();

  parkings.forEach(p=>{
    const remain = Math.max(p.max - p.now, 0);
    let cls="free", text="空きあり";
    if(remain===0){cls="full";text="満車";}
    else if(remain<10){cls="busy";text="混雑";}

    const div = document.createElement("div");
    div.className="parking";
    div.innerHTML = `
      <h3>${p.name}</h3>
      <p class="${cls}">${text}（${remain}台）</p>
      <a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank">
        <button>📍 マップで見る</button>
      </a>
    `;
    list.appendChild(div);
  });
}

render();
</script>

</body>
</html>
