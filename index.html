<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>沖国 駐車場状況</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: system-ui, sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:10px;
}
h1{text-align:center;}
.parking{
  background:#fff;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
}
.free{color:green;}
.busy{color:orange;font-weight:bold;}
.full{color:red;font-weight:bold;}
button{padding:6px 12px;margin-top:6px;}
input{padding:4px;width:70px;}
#authArea input{width:auto;}
.admin-box{
  margin-top:8px;
  background:#f0f0f0;
  padding:8px;
  border-radius:6px;
}
</style>
</head>

<body>

<h1>🚗 沖国 駐車場状況</h1>
<div id="authArea" style="text-align:center;margin-bottom:15px;"></div>
<div id="parkingList"></div>

<script>
/* ===== 固定 管理者アカウント ===== */
const FIXED_ADMIN = {
  id: "admin",
  pass: "okigoku123"
};

/* ===== 初期データ ===== */
const DEFAULT_PARKINGS = [
 {id:1,name:"第1駐車場",lat:26.2625,lng:127.7564,max:200,now:50},
 {id:2,name:"第2駐車場",lat:26.2630,lng:127.7558,max:180,now:30},
 {id:3,name:"第3駐車場",lat:26.2635,lng:127.7549,max:150,now:120},
 {id:4,name:"第4駐車場",lat:26.2619,lng:127.7572,max:100,now:20}
];

/* ===== 駐車場 ===== */
function loadParkings(){
  const data = JSON.parse(localStorage.getItem("parkings"));
  if(!Array.isArray(data)){
    localStorage.setItem("parkings", JSON.stringify(DEFAULT_PARKINGS));
    return DEFAULT_PARKINGS;
  }
  return data;
}
function saveParkings(data){
  localStorage.setItem("parkings", JSON.stringify(data));
}

/* ===== ユーザー ===== */
function getUser(){
  return JSON.parse(localStorage.getItem("adminUser"));
}
function isLoggedIn(){
  return localStorage.getItem("adminLogin") === "true";
}

/* ===== 登録 ===== */
function register(){
  const id = document.getElementById("regId").value;
  const pass = document.getElementById("regPass").value;

  if(!id || !pass){
    alert("IDとパスワード入れて！");
    return;
  }
  localStorage.setItem("adminUser", JSON.stringify({id, pass}));
  alert("登録完了！");
  render();
}

/* ===== ログイン（固定 or 登録） ===== */
function login(){
  const id = document.getElementById("loginId").value;
  const pass = document.getElementById("loginPass").value;
  const user = getUser();

  const fixedOK =
    id === FIXED_ADMIN.id && pass === FIXED_ADMIN.pass;

  const registeredOK =
    user && id === user.id && pass === user.pass;

  if(fixedOK || registeredOK){
    localStorage.setItem("adminLogin","true");
    render();
  }else{
    alert("IDかパスワードが違うよ");
  }
}

/* ===== ログアウト ===== */
function logout(){
  localStorage.removeItem("adminLogin");
  render();
}

/* ===== 認証UI ===== */
function renderAuth(){
  const area = document.getElementById("authArea");

  if(isLoggedIn()){
    area.innerHTML = `
      <p>🛠 管理者ログイン中</p>
      <button onclick="logout()">サインアウト</button>
    `;
    return;
  }

  area.innerHTML = `
    <h3>🔐 管理者ログイン</h3>
    <input id="loginId" placeholder="ユーザーID">
    <input id="loginPass" type="password" placeholder="パスワード"><br>
    <button onclick="login()">サインイン</button>
    <hr>
    <h3>🆕 管理者登録</h3>
    <input id="regId" placeholder="新しいID">
    <input id="regPass" type="password" placeholder="新しいパスワード"><br>
    <button onclick="register()">登録</button>
  `;
}

/* ===== マップ ===== */
function openMap(lat,lng){
  window.open(
    `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`,
    "_blank"
  );
}

/* ===== 更新 ===== */
function updateParking(id){
  const parkings = loadParkings();
  const p = parkings.find(x=>x.id===id);

  const max = Number(document.getElementById(`max-${id}`).value);
  const now = Number(document.getElementById(`now-${id}`).value);

  if(now > max){
    alert("今の台数が最大を超えてる！");
    return;
  }

  p.max = max;
  p.now = now;
  saveParkings(parkings);
  render();
}

/* ===== 表示 ===== */
function render(){
  renderAuth();
  const list = document.getElementById("parkingList");
  list.innerHTML = "";

  loadParkings().forEach(p=>{
    const remain = Math.max(p.max - p.now, 0);
    let cls="free", text="空きあり";
    if(remain===0){cls="full";text="満車";}
    else if(remain<10){cls="busy";text="混雑";}

    const adminUI = isLoggedIn() ? `
      <div class="admin-box">
        最大 <input id="max-${p.id}" type="number" value="${p.max}">
        現在 <input id="now-${p.id}" type="number" value="${p.now}">
        <button onclick="updateParking(${p.id})">更新</button>
      </div>
    ` : "";

    list.innerHTML += `
      <div class="parking">
        <h3>${p.name}</h3>
        <p class="${cls}">${text}（${remain}台）</p>
        <button onclick="openMap(${p.lat},${p.lng})">
          📍 マップで見る
        </button>
        ${adminUI}
      </div>
    `;
  });
}

render();
</script>
</body>
</html>
