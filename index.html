<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>沖国 駐車場状況</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: system-ui, sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:10px;
}
h1{text-align:center;}
.parking{
  background:#fff;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
}
.free{color:green;}
.busy{color:orange;font-weight:bold;}
.full{color:red;font-weight:bold;}
button{
  padding:6px 12px;
  margin-top:6px;
}
#authArea input{
  padding:6px;
  margin:4px;
}
</style>
</head>

<body>

<h1>🚗 沖国 駐車場状況</h1>
<div id="authArea" style="text-align:center;margin-bottom:15px;"></div>
<div id="parkingList"></div>

<script>
/* ===== 初期データ ===== */
const DEFAULT_PARKINGS = [
 {id:1,name:"第1駐車場",lat:26.2625,lng:127.7564,max:200,now:50},
 {id:2,name:"第2駐車場",lat:26.2630,lng:127.7558,max:180,now:30},
 {id:3,name:"第3駐車場",lat:26.2635,lng:127.7549,max:150,now:120}
];

/* ===== 駐車場データ ===== */
function loadParkings(){
  const data = JSON.parse(localStorage.getItem("parkings"));
  if(!Array.isArray(data)){
    localStorage.setItem("parkings", JSON.stringify(DEFAULT_PARKINGS));
    return DEFAULT_PARKINGS;
  }
  return data;
}

/* ===== ユーザー管理 ===== */
function getUser(){
  return JSON.parse(localStorage.getItem("adminUser"));
}

function isLoggedIn(){
  return localStorage.getItem("adminLogin") === "true";
}

/* ===== 登録 ===== */
function register(){
  const id = document.getElementById("regId").value;
  const pass = document.getElementById("regPass").value;

  if(!id || !pass){
    alert("IDとパスワード入れて！");
    return;
  }

  localStorage.setItem("adminUser", JSON.stringify({id, pass}));
  alert("登録完了！ログインしてね");
  render();
}

/* ===== ログイン ===== */
function login(){
  const id = document.getElementById("loginId").value;
  const pass = document.getElementById("loginPass").value;
  const user = getUser();

  if(!user){
    alert("先にユーザー登録して！");
    return;
  }

  if(id === user.id && pass === user.pass){
    localStorage.setItem("adminLogin","true");
    render();
  }else{
    alert("IDかパスワード違うよ");
  }
}

/* ===== ログアウト ===== */
function logout(){
  localStorage.removeItem("adminLogin");
  render();
}

/* ===== 認証UI ===== */
function renderAuth(){
  const area = document.getElementById("authArea");

  if(isLoggedIn()){
    area.innerHTML = `
      <p>🛠 管理者ログイン中</p>
      <button onclick="logout()">サインアウト</button>
    `;
    return;
  }

  if(!getUser()){
    area.innerHTML = `
      <h3>🆕 管理者登録</h3>
      <input id="regId" placeholder="ユーザーID">
      <input id="regPass" type="password" placeholder="パスワード">
      <br>
      <button onclick="register()">登録</button>
    `;
  }else{
    area.innerHTML = `
      <h3>🔐 管理者ログイン</h3>
      <input id="loginId" placeholder="ユーザーID">
      <input id="loginPass" type="password" placeholder="パスワード">
      <br>
      <button onclick="login()">サインイン</button>
    `;
  }
}

/* ===== 表示 ===== */
function render(){
  renderAuth();

  const list = document.getElementById("parkingList");
  list.innerHTML = "";

  const parkings = loadParkings();
  parkings.forEach(p=>{
    const remain = p.max - p.now;
    let cls="free", text="空きあり";
    if(remain<=0){cls="full";text="満車";}
    else if(remain<10){cls="busy";text="混雑";}

    const div = document.createElement("div");
    div.className="parking";
    div.innerHTML = `
      <h3>${p.name}</h3>
      <p class="${cls}">${text}（${remain}台）</p>
    `;
    list.appendChild(div);
  });
}

render();
</script>

</body>
</html>
