<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>沖国 駐車場状況</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: system-ui, sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:10px;
}
h1{text-align:center;}
.parking{
  background:#fff;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
}
.free{color:green;}
.busy{color:orange;font-weight:bold;}
.full{color:red;font-weight:bold;}
button{padding:6px 12px;margin-top:6px;}
input{padding:6px;width:140px;}
.admin-box{
  margin-top:8px;
  background:#f0f0f0;
  padding:8px;
  border-radius:6px;
}
</style>
</head>

<body>

<h1>🚗 沖国 駐車場状況</h1>
<div id="authArea" style="text-align:center;margin-bottom:15px;"></div>
<div id="parkingList"></div>

<script>
const FIXED_ADMIN = { id:"admin", pass:"okigoku123" };

const DEFAULT_PARKINGS = [
 {id:1,name:"第1駐車場",lat:26.2625,lng:127.7564,max:200,now:50},
 {id:2,name:"第2駐車場",lat:26.2630,lng:127.7558,max:180,now:30},
 {id:3,name:"第3駐車場",lat:26.2635,lng:127.7549,max:150,now:120},
 {id:4,name:"第4駐車場",lat:26.2619,lng:127.7572,max:100,now:20},
 {id:5,name:"第5駐車場",lat:26.2621,lng:127.7580,max:120,now:40},
 {id:6,name:"第6駐車場",lat:26.2615,lng:127.7550,max:80, now:10},
 {id:7,name:"第7駐車場",lat:26.2640,lng:127.7560,max:60, now:5}
];

function loadParkings(){
  const d = JSON.parse(localStorage.getItem("parkings"));
  if(!Array.isArray(d)){
    localStorage.setItem("parkings",JSON.stringify(DEFAULT_PARKINGS));
    return DEFAULT_PARKINGS;
  }
  return d;
}
function saveParkings(d){
  localStorage.setItem("parkings",JSON.stringify(d));
}

function getUser(){
  return JSON.parse(localStorage.getItem("adminUser"));
}
function isLoggedIn(){
  return localStorage.getItem("adminLogin")==="true";
}

function auth(){
  const id=document.getElementById("authId").value;
  const pass=document.getElementById("authPass").value;
  if(!id||!pass){alert("IDとパスワード入れて！");return;}

  const user=getUser();

  if(id===FIXED_ADMIN.id && pass===FIXED_ADMIN.pass){
    localStorage.setItem("adminLogin","true"); render(); return;
  }
  if(user && id===user.id && pass===user.pass){
    localStorage.setItem("adminLogin","true"); render(); return;
  }
  if(!user){
    localStorage.setItem("adminUser",JSON.stringify({id,pass}));
    localStorage.setItem("adminLogin","true");
    alert("新規管理者として登録したよ！");
    render(); return;
  }
  alert("IDかパスワードが違うよ");
}

function logout(){
  localStorage.removeItem("adminLogin");
  render();
}

function renderAuth(){
  const a=document.getElementById("authArea");
  if(isLoggedIn()){
    a.innerHTML=`<p>🛠 管理者ログイン中</p><button onclick="logout()">サインアウト</button>`;
  }else{
    a.innerHTML=`
      <h3>🔐 管理者ログイン / 登録</h3>
      <input id="authId" placeholder="ID">
      <input id="authPass" type="password" placeholder="パスワード"><br>
      <button onclick="auth()">ログイン / 新規登録</button>
      <p style="font-size:12px;color:#666;">※ 未登録IDは自動で登録されます</p>
    `;
  }
}

function openMap(lat,lng){
  window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`,"_blank");
}

function updateParking(id){
  const ps=loadParkings();
  const p=ps.find(x=>x.id===id);
  const max=Number(document.getElementById(`max-${id}`).value);
  const now=Number(document.getElementById(`now-${id}`).value);
  if(now>max){alert("台数おかしい！");return;}
  p.max=max;p.now=now;
  saveParkings(ps);
  render();
}

function render(){
  renderAuth();
  const l=document.getElementById("parkingList");
  l.innerHTML="";

  loadParkings().forEach(p=>{
    const r=Math.max(p.max-p.now,0);
    let c="free",t="空きあり";
    if(r===0){c="full";t="満車";}
    else if(r<10){c="busy";t="混雑";}

    l.innerHTML+=`
      <div class="parking">
        <h3>${p.name}</h3>
        <p class="${c}">${t}（${r}台）</p>
        <button onclick="openMap(${p.lat},${p.lng})">📍 マップ</button>
        ${isLoggedIn()?`
          <div class="admin-box">
            最大 <input id="max-${p.id}" type="number" value="${p.max}">
            現在 <input id="now-${p.id}" type="number" value="${p.now}">
            <button onclick="updateParking(${p.id})">更新</button>
          </div>`:""}
      </div>
    `;
  });
}

render();
</script>
</body>
</html>
